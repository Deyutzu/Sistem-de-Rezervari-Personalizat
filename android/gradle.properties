# Memorie pentru procesul Gradle (Compose + Kotlin au nevoie de ceva mai mult decat implicit)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Foloseste librariile AndroidX (standardul actual)
android.useAndroidX=true
# Stilul oficial de cod Kotlin
kotlin.code.style=official
# Clasa R contine doar resursele modulului curent (build mai rapid)
android.nonTransitiveRClass=true
