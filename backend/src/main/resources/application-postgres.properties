# =====================================================================
# Profil "postgres": activează cu
#   mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
# Valorile vin din variabile de mediu (DB_URL, DB_USERNAME, DB_PASSWORD)
# sau din application-local.properties. Parola NU are valoare implicită aici.
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stayfinder}
spring.datasource.username=${DB_USERNAME:stayfinder}
spring.datasource.password=${DB_PASSWORD}

# update: păstrează datele între reporniri (nu șterge tabelele)
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
