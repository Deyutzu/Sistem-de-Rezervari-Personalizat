# =====================================================================
# Configurație comună + profilul implicit de DEZVOLTARE (H2 în memorie)
# Pentru PostgreSQL: rulează cu profilul "postgres" (vezi application-postgres.properties)
# =====================================================================
spring.application.name=stayfinder
server.port=8080

# Secretele locale (parole DB, cheie JWT în faza 4) stau în application-local.properties,
# fișier IGNORAT de git. "optional:" = aplicația pornește și dacă fișierul lipsește.
spring.config.import=optional:classpath:application-local.properties

# --- H2: bază de date în memorie, se recreează la fiecare pornire ---
spring.datasource.url=jdbc:h2:mem:stayfinder;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Consola web H2: http://localhost:8080/h2-console (JDBC URL de mai sus, user "sa")
spring.h2.console.enabled=true

# --- JPA / Hibernate ---
# create-drop: Hibernate creează tabelele din entități la pornire (ok pentru dev)
spring.jpa.hibernate.ddl-auto=create-drop
# open-in-view=false: conexiunea la DB NU rămâne deschisă pe toată durata cererii HTTP.
# Ne obligă să încărcăm datele în service (în @Transactional) - practică recomandată.
spring.jpa.open-in-view=false
# Încarcă colecțiile LAZY (ex. tags) în loturi, nu câte o interogare per cazare (evită N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.show-sql=false

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method

# --- JWT Configuration ---
# Cheie secretă HMAC-SHA (minim 256 biți / 32 caractere). În producție se suprascrie prin application-local.properties sau mediu.
app.jwt.secret=${JWT_SECRET:stayfinderSecretKeyForJwtSigningMustBeAtLeast256BitsLongAndSecureEnough}
# Valabilitate token: 24 ore (în milisecunde)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

